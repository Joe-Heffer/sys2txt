[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sys2txt"
version = "0.6.1"
description = "Record system audio and transcribe to text using AI"
readme = "README.md"
# https://devguide.python.org/versions/
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joe Heffer", email = "jheffer@gmail.com" }]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/Joe-Heffer/sys2txt"
Issues = "https://github.com/Joe-Heffer/sys2txt/issues"

[project.scripts]
sys2txt = "sys2txt.__main__:main"

[project.optional-dependencies]
faster = ["faster-whisper>=1.0.0"]
openai = ["openai-whisper>=20231117"]
all = ["sys2txt[faster,openai]"]
dev = ["ruff>=0.8.0", "pytest>=8.0.0", "pytest-cov>=5.0.0", "genbadge[coverage]>=1.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sys2txt = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.coverage.run]
source = ["sys2txt"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
