name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio

      - name: Validate pyproject.toml
        run: |
          pip install "validate-pyproject[all]"
          validate-pyproject pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"

      - name: Run ruff format check
        run: |
          ruff format --check src/ tests/

      - name: Run ruff linting
        run: |
          ruff check src/ tests/

      - name: Smoke test the installed entry point
        run: |
          sys2txt --version
          python -c "import sys2txt"

      - name: Run unit tests with coverage
        run: |
          pytest --cov=sys2txt --cov-report=term-missing --cov-report=xml -v

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Generate coverage badge
        if: github.event_name == 'push' && matrix.python-version == '3.13'
        run: |
          genbadge coverage -i coverage.xml -o badge.svg

      - name: Commit coverage badge
        if: github.event_name == 'push' && matrix.python-version == '3.13'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update coverage badge"
          file_pattern: badge.svg
