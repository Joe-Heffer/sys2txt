site_name: sys2txt
site_description: Record system audio and transcribe to text using AI
site_url: https://Joe-Heffer.github.io/sys2txt/
repo_url: https://github.com/Joe-Heffer/sys2txt
repo_name: Joe-Heffer/sys2txt
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Installation: installation.md
  - Quick start: quick-start.md
  - CLI reference: cli-reference.md
  - Engines & devices: engines-and-devices.md
  - Live mode: live-mode.md
  - Output formats: output-formats.md
  - Examples: examples.md
  - Python API: python-api.md
  - Troubleshooting: troubleshooting.md
